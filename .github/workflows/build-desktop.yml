name: Build desktop app

# Chạy khi đẩy tag dạng v1.0.0, hoặc bấm "Run workflow" trong tab Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Đẩy tag -> tạo và publish Release kèm file cài đặt.
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vui học GDQP&AN ${{ github.ref_name }}"
          releaseDraft: false
          args: ${{ matrix.args }}

      # Thêm bản sao tên cố định để README trỏ link tải trực tiếp qua releases/latest/download/...
      - name: Upload fixed-name assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p fixed
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            cp src-tauri/target/release/bundle/nsis/*-setup.exe fixed/VuiHocGDQP-AN_Windows_x64-setup.exe
          else
            cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg fixed/VuiHocGDQP-AN_macOS_universal.dmg
          fi
          gh release upload "${{ github.ref_name }}" fixed/* --clobber

      # Chạy tay -> chỉ build, tải file trong mục Artifacts của lần chạy.
      - name: Build
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/msi/*.msi
