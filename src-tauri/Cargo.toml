[package]
name = "vui-hoc-gdqp-an"
version = "1.0.0"
description = "Vui học GDQP&AN — ôn tập và thi thử"
authors = ["anh.le"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
